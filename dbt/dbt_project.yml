name: afrishop
version: "1.0.0"
config-version: 2
profile: afrishop

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  afrishop:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: analytics

seeds:
  afrishop:
    +schema: staging

vars:
  as_of_date: "2026-05-01"   # date de reference des analyses (fin de la periode des donnees)
