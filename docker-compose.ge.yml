# Service Great Expectations (a combiner avec docker-compose.yml, voir README du projet)
services:
  ge:
    build:
      context: .
      dockerfile: infra/ge/Dockerfile
    image: afrishop-ge:latest
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      PYTHONPATH: /opt/project/src
    volumes:
      - ./src:/opt/project/src
      - ./reports:/opt/project/reports
    working_dir: /opt/project
    networks:
      - afrishop-net
